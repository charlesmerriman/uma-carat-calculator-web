name: CI

on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # engines.node in package.json is the one pin: the production
          # buildpack reads it too, so CI runs the Node the site builds on.
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      # tsconfig.json is solution-style (`files: []` plus references), so a bare
      # `tsc --noEmit` type-checks nothing and always passes. `npm run typecheck`
      # checks each referenced project explicitly: the app, then vite.config.ts.
      # Using the script keeps CI and a local run identical.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx vitest run

      # Production runs this same build on the same Node, so a bundle that
      # won't build fails here rather than in a deploy.
      - name: Build
        run: npm run build
