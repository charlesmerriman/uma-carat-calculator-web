name: CI

on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # tsconfig.json is solution-style (`files: []` plus references), so a bare
      # `tsc --noEmit` type-checks nothing and always passes. Check each
      # referenced project explicitly: the app, then vite.config.ts.
      - name: Type check
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npx tsc --noEmit -p tsconfig.node.json

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx vitest run
